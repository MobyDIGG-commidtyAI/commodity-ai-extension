<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Commodity AI: Settings</title>
  <style>
    @font-face { font-family: "Prompt"; font-weight: 400; font-display: swap; src: url(fonts/prompt-400-latin.woff2) format("woff2"); unicode-range: U+0000-00FF, U+2000-206F, U+20AC, U+2122, U+2212; }
    @font-face { font-family: "Prompt"; font-weight: 400; font-display: swap; src: url(fonts/prompt-400-thai.woff2) format("woff2"); unicode-range: U+0E01-0E5B, U+200C-200D, U+25CC; }
    @font-face { font-family: "Prompt"; font-weight: 600; font-display: swap; src: url(fonts/prompt-600-latin.woff2) format("woff2"); unicode-range: U+0000-00FF, U+2000-206F, U+20AC, U+2122, U+2212; }
    @font-face { font-family: "Prompt"; font-weight: 600; font-display: swap; src: url(fonts/prompt-600-thai.woff2) format("woff2"); unicode-range: U+0E01-0E5B, U+200C-200D, U+25CC; }
    :root { --bg: #F3F5F9; --card: #FBFCFE; --border: #DCE3EE; --line: #D9DFEA; --ink: #0B1220; --body: #344054; --muted: #667085;
      --blue: #2F6BFF; --blue-text: #1F4FD8; --ok: #1F4FD8; --bad: #B42318; color-scheme: light; accent-color: var(--blue); }
    * { box-sizing: border-box; }
    ::selection { background: #DCE7FF; color: var(--ink); }
    body { margin: 0; padding: 48px 16px; color: var(--body); caret-color: var(--blue);
      background: radial-gradient(circle at 100% 0%, rgba(47,107,255,.12) 0%, rgba(243,245,249,0) 45%) fixed, var(--bg);
      font: 400 15px/1.55 "Prompt", system-ui, sans-serif; }
    main { max-width: 540px; margin: 0 auto; padding: 32px; background: var(--card); border: 1px solid var(--border); border-radius: 24px;
      box-shadow: 0 20px 60px rgba(15,35,80,.10); }
    h1 { display: flex; align-items: center; gap: 10px; margin: 0 0 6px; font-size: 24px; font-weight: 600; letter-spacing: -.015em; color: var(--ink); }
    h1::before { content: ""; width: 10px; height: 10px; border-radius: 3px; background: var(--blue); box-shadow: 0 2px 8px rgba(47,107,255,.45); }
    p { margin: 0 0 20px; color: var(--muted); font-size: 14px; }
    label { display: block; margin-bottom: 6px; font-weight: 600; color: var(--ink); }
    input { width: 100%; padding: 10px 12px; border: 1px solid var(--line); border-radius: 12px; font: inherit; color: var(--ink); background: #fff; }
    input::placeholder { color: var(--muted); }
    input:focus-visible, button:focus-visible { outline: 2px solid var(--blue); outline-offset: 2px; }
    .actions { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 16px; }
    button { padding: 9px 16px; border: 1px solid var(--line); border-radius: 12px; background: var(--card); color: var(--ink); font: inherit; font-weight: 600; cursor: pointer;
      transition: border-color .2s cubic-bezier(.16,1,.3,1), background-color .2s cubic-bezier(.16,1,.3,1); }
    button:hover { border-color: var(--blue); }
    button.primary { background: var(--blue); border-color: var(--blue); color: #fff; box-shadow: 0 8px 20px -8px rgba(47,107,255,.65); }
    button.primary:hover { background: var(--blue-text); border-color: var(--blue-text); }
    #status { min-height: 1.5em; margin-top: 16px; font-size: 14px; }
    #status[data-kind="ok"] { color: var(--ok); }
    #status[data-kind="bad"] { color: var(--bad); }
    @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
  </style>
</head>
<body>
  <main>
    <h1>Commodity AI settings</h1>
    <p>Check GPU, RAM and SSD evidence on Shopee and Lazada. All displayed prices use THB.</p>
    <form id="form">
      <label for="apiBase">API address</label>
      <input id="apiBase" name="apiBase" type="url" required placeholder="http://localhost:8000" autocomplete="off" spellcheck="false">
      <div class="actions">
        <button class="primary" type="submit">Save</button>
        <button id="test" type="button">Test connection</button>
        <button id="reset" type="button">Reset to default</button>
      </div>
    </form>
    <div id="status" role="status" aria-live="polite"></div>
  </main>
  <script src="options.js"></script>
</body>
</html>
